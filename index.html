<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>애플뮤직 메이커</title>
<style>
:root{--bg:#f2f2f4;--pn:#fff;--tx:#1c1c1e;--mu:#8e8e93;--ln:#e0e0e5;--ac:#fa2d48}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--pn:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ln:#38383a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:28px;max-width:1000px;margin:0 auto;padding:24px 16px 60px}
@media(max-width:820px){.app{grid-template-columns:1fr}.stage{order:-1}}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:14px;margin:22px 0 8px;color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=number],textarea{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:9px;background:var(--pn);color:var(--tx);font:inherit}
textarea{min-height:130px;resize:vertical;font-size:14px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.main{background:var(--ac);border-color:var(--ac);color:#fff}
.trk{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.trk.on{border-color:var(--ac)}
.trk .hd{display:flex;gap:8px;align-items:center}
.trk .hd input{flex:1}.trk .hd .t{width:76px;flex:none}
.hint{font-size:12px;color:var(--mu);margin:4px 0 0}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.tabs .btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.stage{align-self:start}

/* phone: iPhone 16 = 393 x 852 pt */
.pw{margin:0 auto;position:relative}
.phone{--p-bg:#fafafa;--p-tx:#000;--p-mu:#8e8e93;--p-ln:#e3e3e6;--p-gray:#c7c7cc;
 width:393px;height:852px;border-radius:55px;transform-origin:0 0;background:var(--p-bg);color:var(--p-tx);position:relative;overflow:hidden;box-shadow:0 0 0 8px #111,0 18px 50px rgba(0,0,0,.25)}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0;z-index:9;font-weight:700;font-size:17px;pointer-events:none}
.sb .r{display:flex;align-items:center;gap:6px;font-size:15px}
.bat{min-width:27px;height:13px;border-radius:4px;background:var(--p-tx);color:var(--p-bg);font-size:10px;line-height:13px;text-align:center;font-weight:800;padding:0 3px}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.cover{background:#ccc;aspect-ratio:1}
.rb{position:absolute;top:59px;height:44px;display:grid;place-items:center;border-radius:99px;background:var(--p-bg);box-shadow:0 2px 12px rgba(0,0,0,.14);color:var(--p-tx);border:0}
#aView .cover{position:absolute;left:68px;top:127px;width:257px;height:257px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.ttl{position:absolute;top:403px;left:20px;right:20px;text-align:center}
.ttl h3{font-size:18px;line-height:24px;margin:0;font-weight:700}
.ttl .ar{font-size:16px;line-height:24px;margin-top:1.7px;font-weight:700}
.ttl .mt{color:var(--p-mu);font-size:12px;line-height:16px;margin-top:2px;font-weight:700}
.acts{position:absolute;top:482px;left:0;right:0;display:flex;gap:14px;justify-content:center}
.acts button{border:0;border-radius:99px;height:48px;width:48px;background:rgba(120,120,128,.38);color:var(--p-tx);display:grid;place-items:center;cursor:pointer}
.acts .pl{width:160px;background:var(--p-tx);color:var(--p-bg);font-weight:700;font-size:14px;gap:6px;display:flex;align-items:center;justify-content:center}
.hr{position:absolute;top:553px;left:20px;right:20px;height:1px;background:var(--p-ln)}
.list{position:absolute;top:554px;left:0;right:0;height:159px;overflow:auto}
.it{position:relative;display:flex;align-items:center;padding-right:20px;height:49.3px;cursor:pointer}
.it.on{background:rgba(120,120,128,.1)}
.it.on::before{content:"";position:absolute;left:8px;top:21.3px;width:7px;height:7px;border-radius:50%;background:var(--p-mu)}
.it .n{width:20px;margin-left:19px;text-align:center;color:var(--p-mu);font-size:15px;font-weight:500;flex:none}
.it .tt{flex:1;margin-left:9.3px;border-bottom:1px solid var(--p-ln);height:100%;display:flex;align-items:center;justify-content:space-between;font-size:13px;white-space:nowrap;overflow:hidden}
.it.on .tt,.it.pre .tt{border-bottom-color:transparent}
.it .tt::after{content:"";flex:none;width:4px;height:4px;border-radius:50%;background:var(--p-mu);box-shadow:4.5px 0 var(--p-mu),9px 0 var(--p-mu);margin-right:15.5px}
.mini{position:absolute;left:21px;right:21px;top:713px;height:48px;border-radius:24px;background:var(--p-bg);box-shadow:0 4px 20px rgba(0,0,0,.13);display:flex;align-items:center;padding:0 23.7px 0 16px;cursor:pointer}
.mini .c{width:30px;height:30px;flex:none;margin-right:8px}
.mini .m{flex:1;min-width:0;margin-right:16px;font-size:12px;line-height:15.33px;font-weight:700}
.mini .m>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15.33px}
.mini button{position:relative;border:0;background:none;color:var(--p-tx);padding:0;cursor:pointer;display:grid;place-items:center;flex:none;height:24px}
.mini button::after{content:"";position:absolute;inset:-12px -13px}
.mini #mPlay{width:12.7px;margin-right:26.3px}
.mini #mNext{width:24px}
.mini svg{display:block;overflow:visible}
.tbar,.sr{position:absolute;top:769px;height:62px;background:var(--p-bg);box-shadow:0 4px 20px rgba(0,0,0,.13)}
.tbar{left:21px;width:281px;border-radius:31px}
.sr{left:310px;width:62px;border-radius:50%}
.tbar img,.sr img{position:absolute;display:block}
.phone.inv .tbar img{filter:invert(1)}
.grip{position:absolute;top:65px;left:50%;width:60px;height:5px;margin-left:-30px;border-radius:9px;background:var(--p-grip,rgba(0,0,0,.53));cursor:pointer;z-index:8}
#pView .top{position:absolute;left:32px;right:32px;top:91px;height:72px;display:flex;align-items:center;gap:0}
#pView .top .cover{width:72px;flex:none;margin-right:12px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
#pView .top .i{flex:1;min-width:0;font-weight:700;font-size:12.9px;line-height:16px;transform:translateY(2.8px)}
#pView .top .i>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pView .top .i span{display:block;color:var(--ac);font-weight:600;font-size:12.2px;line-height:16px}
.cb{width:32px;height:32px;border-radius:50%;background:rgba(120,120,128,.2);display:grid;place-items:center;color:var(--ac);flex:none;margin-left:16px;transform:translateY(2.8px)}
.lyr{position:absolute;left:26px;right:26px;top:155px;height:412px;overflow:hidden;padding:0 6px;-webkit-mask-image:linear-gradient(transparent 0%,#000 17.2%,#000 57%,transparent 100%);mask-image:linear-gradient(transparent 0%,#000 17.2%,#000 57%,transparent 100%)}
.lyr .in{padding:60px 0 200px}
.lyr p{margin:0;padding:12.5px 0;font-size:30px;line-height:37.5px;font-weight:600;color:var(--p-lyr,rgba(0,0,0,.4));transition:color .3s}
.lyr p.on{color:var(--p-tx)}
.lyr p.d{}
.dots{display:flex;gap:10px;padding:12px 0}.dots i{width:20px;height:20px;border-radius:50%;background:var(--p-gray)}
.bar{position:absolute;left:32px;right:32px;top:558px;height:7px;border-radius:9px;background:var(--p-track,rgba(0,0,0,.15));overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--p-fill,rgba(0,0,0,.575))}
.tm{position:absolute;left:32px;right:32px;top:575.3px;display:flex;justify-content:space-between;font-size:11px;line-height:18px;font-weight:700;letter-spacing:1px}
.ctl{position:absolute;left:0;right:0;top:623.7px;height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 60px}
.ctl button{border:0;background:none;color:var(--p-tx);cursor:pointer;padding:0;width:60px;height:60px;display:grid;place-items:center}
.ctl svg{overflow:visible}
#prev{transform:translateX(-.67px)}#pp{transform:translateX(-.33px)}
.vol{position:absolute;left:0;right:0;top:737.3px;height:6.67px;color:var(--p-fill,rgba(0,0,0,.575))}
.vol i{position:absolute;left:58.3px;width:266.7px;top:0;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--p-fill,rgba(0,0,0,.575)) 25%,var(--p-track,rgba(0,0,0,.15)) 25%)}
.vol svg{position:absolute}
.pbot{position:absolute;inset:0;pointer-events:none}.home{position:absolute;left:126.67px;top:839px;width:140px;height:5px;border-radius:9px;background:var(--p-home,rgba(0,0,0,.39));z-index:8;pointer-events:none}
.pbot svg{position:absolute;display:block;color:var(--ac);overflow:visible}
svg{display:block}
.btn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tabs{flex-wrap:wrap}
.cv{position:relative;overflow:hidden;border-radius:calc(var(--rad,7)*1%)!important}
.cv .ci{position:absolute;inset:0;background:center/cover}
#aCov{touch-action:none;cursor:grab}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ac)}
.clr{width:100%;height:38px;border:1px solid var(--ln);border-radius:9px;background:var(--pn)}
.phone.cap{box-shadow:none}
.ed,.stage{min-width:0}
.mtabs{display:none}
@media(max-width:820px){
 .app{display:block;padding:12px 16px 40px}
 .mtabs{display:flex;gap:6px;position:sticky;top:0;z-index:5;padding:8px 0;background:var(--bg)}
 .mtabs .btn{flex:1}
 .stage{position:static}
 .ed{display:none}
 body.m-ed .ed{display:block}
 body.m-ed .stage{display:none}
 }
</style>
</head>
<body>
<div class="app">
<div class="mtabs"><button class="btn on" data-m="stage">미리보기</button><button class="btn" data-m="ed">편집</button></div>
<main class="ed">
  <div class="lang"><button class="btn" data-l="ko">KR</button><button class="btn" data-l="en">EN</button><button class="btn" data-l="ja">JP</button></div>
  <h1>뮤직 메이커</h1>
  <h2>앨범</h2>
  <label>앨범 커버</label>
  <input type="file" id="cov" accept="image/*">
  <h2>커버 조정</h2>
  <label>확대</label><input type="range" id="cz" min="1" max="4" step="0.01">
  <label>회전</label>
  <div class="row"><input type="range" id="cr" min="-180" max="180" step="1" style="flex:4"><button class="btn" id="rl" style="flex:none" aria-label="-90">↺</button><button class="btn" id="rr" style="flex:none" aria-label="+90">↻</button></div>
  <label>모서리</label><input type="range" id="cd" min="0" max="50" step="1">
  <button class="btn" id="creset" style="margin-top:10px">위치 초기화</button>
  <p class="hint">앨범 화면의 커버를 드래그하거나 휠로 확대/축소할 수 있어요.</p>
  <label>앨범 제목</label><input type="text" id="title">
  <label>아티스트</label><input type="text" id="artist">
  <div class="row">
    <div><label>장르</label><input type="text" id="genre"></div>
    <div><label>연도</label><input type="text" id="year"></div>
  </div>
  <div class="row">
    <div><label>상태바 시간 (비우면 숨김)</label><input type="text" id="sbt"></div>
    <div><label>배터리 %</label><input type="text" id="sbb"></div>
  </div>
  <div class="row">
    <div><label>포인트 컬러</label><input type="color" id="ac" style="width:100%;height:38px;border:1px solid var(--ln);border-radius:9px;background:var(--pn)"></div>
    <div><label>화면 테마</label><button class="btn" id="theme" style="width:100%">라이트 / 다크</button></div>
  </div>
  <h2>배경</h2>
  <div class="row"><button class="btn on" id="m1">단색</button><button class="btn" id="m2">그라데이션</button></div>
  <div class="row">
    <div><label>배경색</label><input type="color" id="bg1" class="clr"></div>
    <div><label>배경색 2</label><input type="color" id="bg2" class="clr"></div>
    <div><label>텍스트 색</label><input type="color" id="tx" class="clr"></div>
  </div>
  <h2>수록곡</h2>
  <div id="trks"></div>
  <button class="btn" id="add">+ 곡 추가</button>
  <h2>저장</h2>
  <div class="row">
    <button class="btn main" id="exp">설정 파일 저장</button>
    <button class="btn" id="imp">설정 파일 불러오기</button>
  </div>
  <input type="file" id="impf" accept=".json" hidden>
  <p class="hint">작업 내용은 이 브라우저에 자동 저장돼요. 다른 기기에서 이어서 하려면 설정 파일로 저장하세요. 음원 파일은 파일에 포함되지 않아요.</p>
</main>

<section class="stage">
  <div class="tabs"><button class="btn on" data-v="aView">앨범 화면</button><button class="btn" data-v="pView">재생 화면</button><button class="btn main" id="shot">이미지 저장 (PNG)</button></div>
  <div class="pw" id="pw"><div class="phone" id="phone">
    <div class="sb" id="sb"><span id="sbT">20:51</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg><span>5G</span><span class="bat" id="sbBn">81</span></span></div>
    <div class="view on" id="aView">
      <div class="rb" style="left:16px;width:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="rb" style="right:16px;width:104px;display:flex;gap:20px;justify-content:center;align-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M6 11H5v10h14V11h-1"/></svg><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></div>
      <div class="cover cv" id="aCov"></div>
      <div class="ttl"><h3 id="aTitle"></h3><div class="ar" id="aArtist"></div><div class="mt" id="aMeta"></div></div>
      <div class="acts">
        <button aria-label="셔플"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17h3c3 0 5-2 7-5s4-5 7-5h1M2 7h3c3 0 5 2 7 5s4 5 7 5h1M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
        <button class="pl" id="aPlay"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.6c0-1 1-1.6 1.9-1.1l13 8.4c.8.5.8 1.7 0 2.2l-13 8.4c-.9.6-1.9 0-1.9-1.1z"/></svg>재생</button>
        <button aria-label="추가"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="hr"></div>
      <div class="list" id="aList"></div>
      <div class="mini" id="mini"><div class="c cv" id="mCov"></div><div class="m"><div id="mTitle"></div><div id="mArtist"></div></div>
        <button id="mPlay" aria-label="재생"></button>

<script>
const $=s=>document.querySelector(s);
const ICON={play:'<svg width="34" height="40" viewBox="0 0 34 40" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"><path d="M3 3v34l28-17z"/></svg>',
 pause:'<svg width="30" height="40" viewBox="0 0 30 40" fill="currentColor"><rect x="0" width="12" height="40" rx="4"/><rect x="18" width="12" height="40" rx="4"/></svg>',
 mplay:'<svg width="15" height="17" viewBox="0 0 15 17" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M1.5 1.5v14l12-7z"/></svg>',
 mpause:'<svg width="13" height="17" viewBox="0 0 13 17" fill="currentColor"><rect x="0" width="5" height="17" rx="1.8"/><rect x="8" width="5" height="17" rx="1.8"/></svg>'};
const SAMPLE_LYR="0:05 첫 번째 가사 줄을\n0:10 이렇게 시간과 함께 적어요\n0:16 시간은 분:초 형식이에요\n0:22 한 줄에 하나씩 입력하세요";
let S={cover:'',title:'앨범 제목',artist:'아티스트',genre:'R&B/소울',year:'2026',ac:'#fa2d48',lang:'ko',sbt:'20:51',sbb:'81',mode:'solid',bg1:'#fafafa',bg2:'#ead9dc',tx:'#000000',cv:{x:0,y:0,z:1,r:0,rad:7},
 tracks:[{title:'첫 번째 곡',dur:'3:06',lyrics:SAMPLE_LYR},{title:'두 번째 곡',dur:'3:40',lyrics:''}]};
let cur=0,t=0,playing=false,timer=null,au=new Audio(),audioUrls={};
try{const sv=localStorage.getItem('mm');if(sv)S=Object.assign(S,JSON.parse(sv))}catch(e){}

const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const durOf=tr=>{const m=String(tr.dur).match(/(\d+):(\d{2})/);return m?+m[1]*60+ +m[2]:180};
function parseLyr(txt){let last=0;return (txt||'').split('\n').filter(l=>l.trim()).map(l=>{
 const m=l.match(/^\s*\[?(\d+):(\d{2})(?:\.\d+)?\]?\s*(.*)$/);
 if(m){last=+m[1]*60+ +m[2];return{t:last,x:m[3]}}return{t:last,x:l.trim()}})}
let save_t;function save(){clearTimeout(save_t);save_t=setTimeout(()=>{try{localStorage.setItem('mm',JSON.stringify(S))}catch(e){}},300)}
const bg=u=>u?`url("${u}")`:'linear-gradient(135deg,#d6e4e6,#b9b9bd 50%,#c1272d)';

function renderEditor(){
 syncCtl();$('#sbt').value=S.sbt;$('#sbb').value=S.sbb;$('#title').value=S.title;$('#artist').value=S.artist;$('#genre').value=S.genre;$('#year').value=S.year;$('#ac').value=S.ac;
 const box=$('#trks');box.innerHTML='';
 S.tracks.forEach((tr,i)=>{
  const d=document.createElement('div');d.className='trk'+(i===cur?' on':'');
  d.innerHTML=`<div class="hd"><b>${i+1}</b><input type="text" class="ti" value="" placeholder="곡 제목"><input type="text" class="t du" placeholder="3:06"><button class="btn rm" aria-label="삭제">✕</button></div>
  <label>가사 (한 줄에 하나, 앞에 분:초)</label><textarea class="ly" placeholder="0:12 가사 한 줄"></textarea>
  <label>음원 파일 (선택)</label><input type="file" class="au" accept="audio/*">
  <p class="hint">${audioUrls[i]?'음원 연결됨 · 실제 재생 시간에 가사가 맞춰져요':'음원이 없으면 입력한 재생 시간으로 가상 재생돼요'}</p>`;
  d.querySelector('.ti').value=tr.title;d.querySelector('.du').value=tr.dur;d.querySelector('.ly').value=tr.lyrics;d.querySelector('.ti').placeholder=T('곡 제목');d.querySelector('.ly').placeholder=T('0:12 가사 한 줄');
  d.querySelector('.ti').oninput=e=>{tr.title=e.target.value;save();renderAlbum();renderPlayer()};
  d.querySelector('.du').oninput=e=>{tr.dur=e.target.value;save();tick(true)};
  d.querySelector('.ly').oninput=e=>{tr.lyrics=e.target.value;save();if(i===cur)renderLyr()};
  d.querySelector('.ly').onfocus=()=>{if(cur!==i){setTrack(i,false);document.querySelectorAll('.trk').forEach((x,k)=>x.classList.toggle('on',k===i))}};
  d.querySelector('.rm').onclick=()=>{if(S.tracks.length<2)return;S.tracks.splice(i,1);delete audioUrls[i];cur=Math.min(cur,S.tracks.length-1);save();renderAll()};
  d.querySelector('.au').onchange=e=>{const f=e.target.files[0];if(!f)return;audioUrls[i]=URL.createObjectURL(f);
   const a=new Audio(audioUrls[i]);a.onloadedmetadata=()=>{tr.dur=fmt(a.duration);save();renderEditor();if(i===cur)setTrack(i,false)};renderEditor()};
  box.appendChild(d)});
 i18n();
}
function renderAlbum(){
 applyTheme();$('#sb').style.display=S.sbt?'flex':'none';$('#sbT').textContent=S.sbt;$('#sbBn').textContent=S.sbb;document.documentElement.style.setProperty('--ac',S.ac);
 paintCover();$('#aTitle').textContent=S.title;$('#aArtist').textContent=S.artist;
 const yr=S.year&&(S.lang==='en'?S.year:S.year+(S.lang==='ja'?'年':'년'));$('#aMeta').textContent=[S.genre,yr].filter(Boolean).join(' · ');
 const l=$('#aList');l.innerHTML='';
 S.tracks.forEach((tr,i)=>{const r=document.createElement('div');r.className='it'+(i===cur?' on':'')+(i===cur-1?' pre':'');
  r.innerHTML=`<span class="n">${i+1}</span><span class="tt"></span>`;r.querySelector('.tt').textContent=tr.title;
  r.onclick=()=>{setTrack(i,true);showView('pView')};l.appendChild(r)});
 $('#mTitle').textContent=S.tracks[cur].title;$('#mArtist').textContent=S.artist;
}
function renderPlayer(){
 const tr=S.tracks[cur];$('#pTitle').textContent=tr.title;$('#pArtist').textContent=S.artist;
 $('#pp').innerHTML=playing?ICON.pause:ICON.play;$('#mPlay').innerHTML=playing?ICON.mpause:ICON.mplay;
}
let L=[];
function renderLyr(){
 L=parseLyr(S.tracks[cur].lyrics);const in_=$('#lyrIn');
 in_.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
 L.forEach(o=>{const p=document.createElement('p');p.textContent=o.x;in_.appendChild(p)});
 if(!L.length){const p=document.createElement('p');p.textContent=T('가사를 입력하면 여기에 표시돼요');in_.appendChild(p)}
 tick(true);
}
function now(){return S.tracks[cur]&&audioUrls[cur]?au.currentTime:t}
function tick(force){
 const tr=S.tracks[cur],D=durOf(tr),n=now();
 $('#fill').style.width=Math.min(100,n/D*100)+'%';$('#cur').textContent=fmt(n);$('#rem').textContent='−'+fmt(D-n);
 let a=-1;L.forEach((o,i)=>{if(o.t<=n)a=i});
 const ps=$('#lyrIn').querySelectorAll('p');
 ps.forEach((p,i)=>{p.classList.toggle('on',i===a);p.classList.toggle('d',Math.abs(i-a)>2)});
 $('#lyrIn').querySelector('.dots').style.display=a<0?'flex':'none';
 if(a>=0&&ps[a]){const box=$('#lyr');box.scrollTo({top:Math.max(0,ps[a].offsetTop-68.5),behavior:force?'auto':'smooth'})}
 else $('#lyr').scrollTop=0;
}
function loop(){clearInterval(timer);timer=setInterval(()=>{
 if(!playing)return;if(!audioUrls[cur])t+=.25;
 if(now()>=durOf(S.tracks[cur])-.05||(audioUrls[cur]&&au.ended)){if(cur<S.tracks.length-1)setTrack(cur+1,true);else{playing=false;t=0;au.pause();renderPlayer()}}
 tick()},250)}
function setTrack(i,play){cur=i;t=0;au.pause();au.src=audioUrls[i]||'';playing=!!play;
 if(play&&audioUrls[i])au.play().catch(()=>{});
 renderAlbum();renderPlayer();renderLyr();loop()}
function toggle(){playing=!playing;if(audioUrls[cur]){playing?au.play().catch(()=>{}):au.pause()}renderPlayer()}
function seek(r){const D=durOf(S.tracks[cur]);if(audioUrls[cur])au.currentTime=r*D;else t=r*D;tick(true)}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
 document.querySelectorAll('.tabs .btn[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===id));if(id==='pView')tick(true)}
function renderAll(){renderEditor();renderAlbum();renderPlayer();renderLyr()}

['title','artist','genre','year'].forEach(k=>$('#'+k).oninput=e=>{S[k]=e.target.value;save();renderAlbum();renderPlayer()});
$('#ac').oninput=e=>{S.ac=e.target.value;save();renderAlbum()};
$('#theme').onclick=()=>{if(S.bg1==='#fafafa'){S.bg1='#161618';S.bg2='#3a2a30';S.tx='#ffffff'}else{S.bg1='#fafafa';S.bg2='#ead9dc';S.tx='#000000'}save();syncCtl();applyTheme()};
$('#cov').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  S.cover=c.toDataURL('image/jpeg',.88);save();renderAlbum();renderPlayer()};im.src=URL.createObjectURL(f)};

 while(n=w.nextNode()){if(n.__o===undefined){const k=n.nodeValue.trim();if(!k)continue;n.__o=k}n.nodeValue=T(n.__o)}})}
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
function applyTheme(){const p=$('#phone'),s=p.style;
 s.setProperty('--p-bg',S.bg1);s.setProperty('--p-tx',S.tx);s.setProperty('--p-mu',rgba(S.tx,.5));s.setProperty('--p-ln',rgba(S.tx,.12));s.setProperty('--p-gray',rgba(S.tx,.25));s.setProperty('--p-fill',rgba(S.tx,.575));s.setProperty('--p-track',rgba(S.tx,.15));s.setProperty('--p-lyr',rgba(S.tx,.4));s.setProperty('--p-grip',rgba(S.tx,.53));s.setProperty('--p-home',rgba(S.tx,.39));
 $('#pView').style.background=(S.bg1.toLowerCase()==='#fafafa'&&S.mode!=='grad')?'#fff':'';
 p.classList.toggle('inv',(parseInt(S.tx.slice(1),16)>>16)>140);
 s.background=S.mode==='grad'?`linear-gradient(165deg,${S.bg1},${S.bg2})`:S.bg1}
function paintCover(){const c=S.cv;
 ['aCov','pCov','mCov'].forEach(id=>{const el=$('#'+id),i=document.createElement('i');i.className='ci';
  i.style.backgroundImage=bg(S.cover);i.style.transform=`translate(${c.x}%,${c.y}%) rotate(${c.r}deg) scale(${c.z})`;el.replaceChildren(i)});
 $('#phone').style.setProperty('--rad',c.rad)}
function syncCtl(){$('#cz').value=S.cv.z;$('#cr').value=S.cv.r;$('#cd').value=S.cv.rad;
 ['bg1','bg2','tx'].forEach(k=>$('#'+k).value=S[k]);
 $('#m1').classList.toggle('on',S.mode!=='grad');$('#m2').classList.toggle('on',S.mode==='grad');
 document.querySelectorAll('.lang .btn').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang))}

const rot=d=>{S.cv.r=(((+S.cv.r+d+180)%360)+360)%360-180;save();syncCtl();paintCover()};
$('#rl').onclick=()=>rot(-90);$('#rr').onclick=()=>rot(90);
$('#creset').onclick=()=>{S.cv={x:0,y:0,z:1,r:0,rad:S.cv.rad};save();syncCtl();paintCover()};
{const ac=$('#aCov');let dr=null;
 ac.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY};ac.setPointerCapture(e.pointerId)};
 ac.onpointermove=e=>{if(!dr)return;const r=ac.getBoundingClientRect();S.cv.x+=(e.clientX-dr.x)/r.width*100;S.cv.y+=(e.clientY-dr.y)/r.height*100;dr={x:e.clientX,y:e.clientY};paintCover()};
